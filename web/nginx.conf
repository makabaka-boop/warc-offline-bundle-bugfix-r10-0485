server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The control page itself may use scripts (it drives the viewer), but the
    # replay frame is served from a separate origin with sandbox="".
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src http://localhost:8000; frame-src http://localhost:8000; img-src 'self' data:; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
